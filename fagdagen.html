<!DOCTYPE html>
<html lang="nb">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fagdagen</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---------- Stage: diagram and slide share the same cell ---------- */
    .stage {
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      margin: 0 auto;
      padding: 0.5rem;
      box-sizing: border-box;
      display: grid;
      place-items: center;
    }

    .diagram-wrap,
    .slide-wrap {
      grid-area: 1 / 1;
    }

    .diagram-wrap {
      width: 100%;
      max-width: 580px;
    }

    .diagram-wrap.diagram-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .diagram-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
    }

    .slide-wrap {
      width: 100%;
      max-width: min(97vw, 1500px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    }

    .stage.has-slide .slide-wrap {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.35s ease 0.15s, visibility 0s;
    }

    .slide {
      box-sizing: border-box;
      padding: 0;
      width: 100%;
    }

    /* ---------- Slide card ---------- */
    .slide-card {
      --accent: #38bdf8;
      position: relative;
      background: #1e293b;
      border: 1px solid #334155;
      border-top: 4px solid var(--accent);
      border-radius: 1rem;
      padding: clamp(1.2rem, 2.2vw, 2.2rem);
      min-height: 94vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6);
    }

    .slide-head {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    /* Mini icon of the diagram: click to go back to the diagram */
    .slide-icon {
      flex: none;
      width: 72px;
      height: 70px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 0.5rem;
      transition: transform 0.2s ease;
    }

    .slide-icon:hover {
      transform: scale(1.08);
    }

    .slide-icon:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .slide-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .slide-logo {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: contain;
      background: #0f172a;
      border: 2.5px solid var(--accent);
    }

    .slide-eyebrow {
      margin: 0 0 0.35rem 0;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .slide-title {
      margin: 0;
      font-size: clamp(1.8rem, 3.2vw, 2.75rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }

    .slide-content-area {
      flex: 1;
    }

    .slide-body {
      margin: 0;
      font-size: clamp(1.15rem, 1.4vw, 1.4rem);
      line-height: 1.7;
      color: #cbd5e1;
    }

    .slide-body a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .slide-body a:hover {
      color: #f8fafc;
    }

    .slide-body+.slide-list {
      margin-top: 1.25rem;
    }

    .slide-list+.slide-after {
      margin-top: 1.5rem;
    }

    .slide-body u,
    .slide-list u {
      text-underline-offset: 3px;
    }

    .slide-indent {
      display: inline-block;
      margin: 0.5rem 0 0 1.4rem;
      color: #f8fafc;
    }

    .slide-list {
      margin: 0;
      padding-left: 2rem;
      font-size: clamp(1.15rem, 1.4vw, 1.35rem);
      line-height: 1.75;
      color: #cbd5e1;
    }

    .slide-body strong,
    .slide-list strong {
      color: #f8fafc;
    }

    .slide-list li {
      margin-bottom: 1rem;
    }

    /* Ordered lists: labels generated by the browser, e.g. (a) (b) (c) or (1) (2) (3) */
    @counter-style paren-alpha {
      system: extends lower-alpha;
      prefix: "(";
      suffix: ") ";
    }

    @counter-style paren-decimal {
      system: extends decimal;
      prefix: "(";
      suffix: ") ";
    }

    .slide-list-none {
      list-style: none;
      padding-left: 0;
    }

    .slide-link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .slide-link:hover {
      color: #f8fafc;
    }

    .slide-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .slide-list-alpha {
      list-style: paren-alpha;
      padding-left: 2.4rem;
    }

    .slide-list-decimal {
      list-style: paren-decimal;
      padding-left: 2.4rem;
    }

    .slide-sublist {
      margin: 0.6rem 0 0 0;
      padding-left: 1.2rem;
      list-style: circle;
    }

    .slide-sublist-plain {
      list-style: none;
    }

    .slide-sublist li {
      margin-bottom: 0.5rem;
    }

    .slide-list a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .slide-list a:hover {
      color: #f8fafc;
    }

    .slide-list li::marker {
      color: var(--accent);
    }

    .slide-visual {
      text-align: center;
    }

    .slide-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: 1rem;
    }

    .slide-nav-end {
      justify-content: flex-end;
    }

    .slide-nav button {
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      border-radius: 0.6rem;
      padding: 0.6rem 1.4rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .slide-nav button:hover {
      border-color: var(--accent);
      background: #1e293b;
      color: #f8fafc;
      transform: translateY(-1px);
    }

    /* ---------- Diagram text styles ---------- */
    .label-pill {
      font-size: 19px;
      font-weight: 700;
      fill: #ffffff;
      paint-order: stroke fill;
      stroke: #0f172a;
      stroke-width: 5px;
    }

    .dir-title {
      font-size: 15px;
      font-weight: 700;
      fill: #f8fafc;
      pointer-events: none;
      paint-order: stroke fill;
      stroke: #0f172a;
      stroke-width: 3.5px;
    }

    /* ---------- Two-circle Venn inside the Health Psychology slide ---------- */
    .mini-venn {
      display: block;
      width: 100%;
      max-width: 960px;
      max-height: min(70vh, 620px);
      height: auto;
      margin: 1.5rem auto 0 auto;
    }

    .slide-img {
      display: block;
      max-width: 100%;
      max-height: min(68vh, 650px);
      width: auto;
      height: auto;
      margin: 0 auto;
      border-radius: 0.75rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .mini-label {
      font-size: 20px;
      font-weight: 700;
    }

    .mini-overlap {
      font-size: 16px;
      font-weight: 700;
      fill: #f5d0fe;
    }

    @media (max-width: 899px) {
      .slide-card {
        padding: 1.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .slide-wrap,
      .stage.has-slide .slide-wrap,
      .slide-icon {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="stage" id="stage">

    <div class="diagram-wrap" id="diagramWrap">
      <!-- Venn Diagram SVG -->
      <svg viewBox="170 -30 560 855" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Two Main Intersecting Circles (Vertical Orientation, enlarged) -->
        <!-- Circle 1: Health Psychology (Top) -->
        <circle cx="450" cy="275" r="230" fill="rgba(168, 85, 247, 0.18)" stroke="#a855f7" stroke-width="3" />

        <!-- Circle 2: Ketamine-Assisted Psychotherapy (Bottom) -->
        <circle cx="450" cy="505" r="230" fill="rgba(236, 72, 153, 0.18)" stroke="#ec4899" stroke-width="3" />

        <!-- Main Category Labels Outside Circles -->
        <g id="node-circle_health" onclick="showInfo('circle_health')" style="cursor:pointer">
          <rect x="270" y="-18" width="360" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="2.5"
            opacity="0" pointer-events="none" />
          <text x="450" y="6" text-anchor="middle" class="label-pill" fill="#c084fc">Klinisk helsepsykologi</text>
        </g>

        <g id="node-circle_kap" onclick="showInfo('circle_kap')" style="cursor:pointer">
          <rect x="250" y="765" width="400" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="2.5"
            opacity="0" pointer-events="none" />
          <text x="450" y="789" text-anchor="middle" class="label-pill" fill="#f472b6">Ketaminassistert
            psykoterapi</text>
        </g>

        <!-- Logo: PsykologForeningen / ACL — Pure Health Psychology (Top) -->
        <g id="node-psyk" class="logo-node" onclick="showInfo('psyk')" style="cursor:pointer">
          <defs>
            <clipPath id="clip-psyk">
              <circle cx="450" cy="175" r="46" />
            </clipPath>
          </defs>
          <circle cx="450" cy="175" r="46" fill="#1e293b" stroke="#a855f7" stroke-width="3" />
          <image href="ACL.png" x="404" y="129" width="92" height="92" clip-path="url(#clip-psyk)"
            preserveAspectRatio="xMidYMid meet" />
        </g>

        <!-- Logo: EmmaSofia — Pure Ketamine-Assisted (Bottom) -->
        <g id="node-emma" class="logo-node" onclick="showInfo('emma')" style="cursor:pointer">
          <defs>
            <clipPath id="clip-emma">
              <circle cx="450" cy="605" r="46" />
            </clipPath>
          </defs>
          <circle cx="450" cy="605" r="46" fill="#1e293b" stroke="#ec4899" stroke-width="3" />
          <image href="EmmaSofia.png" x="404" y="559" width="92" height="92" clip-path="url(#clip-emma)"
            preserveAspectRatio="xMidYMid meet" />
        </g>

        <!-- Center Intersection: Senter for smerte og helsepsykologi -->
        <g id="node-axon" class="logo-node" onclick="showInfo('axon')" style="cursor:pointer">
          <circle cx="450" cy="390" r="82" fill="#2b1b3d" stroke="#38bdf8" stroke-width="3" />
          <text text-anchor="middle" class="dir-title" fill="#e0f2fe">
            <tspan x="450" y="365" font-size="17" font-weight="700">Senter for</tspan>
            <tspan x="450" y="391" font-size="19" font-weight="700">smerte og</tspan>
            <tspan x="450" y="417" font-size="17" font-weight="700">helsepsykologi</tspan>
          </text>
        </g>
      </svg>
    </div>

    <!-- Slide area: empty until something is selected -->
    <aside class="slide-wrap" aria-live="polite">
      <div class="slide" id="slide"></div>
    </aside>

  </main>

  <script>
    /* ------------------------------------------------------------------
       Slides — one entry per clickable. Each topic has a list of `pages`.
       Add more objects to `pages` to give a topic more slides.
       Every page needs a `title` (the slide title, big heading; the topic `title` is shown on the small line above it)
       and can have `text`, `list` (array of bullet points), or `visual` (custom markup).
       `logo` is optional.
       ------------------------------------------------------------------ */
    const miniVenn = `
      <svg class="mini-venn" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-label="Venndiagram: Somatisk og psykisk overlapper i somatisk-psykisk komorbiditet">
        <defs>
          <clipPath id="mini-clip-somatic">
            <circle cx="140" cy="130" r="120" />
          </clipPath>
        </defs>
        <circle cx="140" cy="130" r="120" fill="rgba(168, 85, 247, 0.22)" stroke="#a855f7" stroke-width="3" />
        <circle cx="260" cy="130" r="120" fill="rgba(56, 189, 248, 0.22)" stroke="#38bdf8" stroke-width="3" />
        <circle cx="260" cy="130" r="120" fill="rgba(240, 171, 252, 0.28)" clip-path="url(#mini-clip-somatic)" />
        <text x="80" y="136" text-anchor="middle" class="mini-label" fill="#c084fc">Somatisk</text>
        <text x="320" y="136" text-anchor="middle" class="mini-label" fill="#7dd3fc">Psykisk</text>
        <text class="mini-overlap" text-anchor="middle">
          <tspan x="200" y="112">Somatisk-</tspan>
          <tspan x="200" y="132">psykisk</tspan>
          <tspan x="200" y="152">komorbiditet</tspan>
        </text>
      </svg>`;

    /* Mini two-circle icon (Health Psychology Top and KAP Bottom) */
    const ICON_REGION = { x: 200, y: 35, w: 500, h: 710 };   // in big-diagram viewBox units
    const iconSvg = `
      <svg viewBox="${ICON_REGION.x} ${ICON_REGION.y} ${ICON_REGION.w} ${ICON_REGION.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="450" cy="275" r="230" fill="rgba(168, 85, 247, 0.18)" stroke="#a855f7" stroke-width="14" />
        <circle cx="450" cy="505" r="230" fill="rgba(236, 72, 153, 0.18)" stroke="#ec4899" stroke-width="14" />
      </svg>`;

    /* The two main circles: for these topics the slide icon is just that one circle
       (the other circle is left out), and the diagram shrinks onto that circle. */
    const CIRCLES = {
      circle_health: { idx: 0, cx: 450, cy: 275, fill: 'rgba(168, 85, 247, 0.18)', stroke: '#a855f7' },
      circle_kap: { idx: 1, cx: 450, cy: 505, fill: 'rgba(236, 72, 153, 0.18)', stroke: '#ec4899' }
    };

    /* The logo / intersection nodes: each marks one specific region of the Venn diagram.
       inc = circles the region is inside, exc = circles it must be outside of.
       0: Health Psychology (cx=450, cy=275), 1: KAP (cx=450, cy=505) */
    const CIRCLE_GEOM = [{ cx: 450, cy: 275 }, { cx: 450, cy: 505 }];
    const CIRCLE_STROKES = ['#a855f7', '#ec4899'];
    const REGIONS = {
      psyk: { inc: [0], exc: [1], color: '#a855f7' },   // pure Health
      emma: { inc: [1], exc: [0], color: '#ec4899' },   // pure KAP
      axon: { inc: [0, 1], exc: [], color: '#c084fc' }    // Health + KAP
    };

    // Bounding box of a region (in big-diagram units), found by sampling; cached
    const _boxCache = {};
    function regionBox(id) {
      if (_boxCache[id]) return _boxCache[id];
      const R = REGIONS[id];
      const inside = (i, x, y) => {
        const g = CIRCLE_GEOM[i];
        return (x - g.cx) ** 2 + (y - g.cy) ** 2 <= 230 * 230;
      };
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (let x = 150; x <= 750; x += 2) {
        for (let y = 30; y <= 770; y += 2) {
          if (R.inc.every(i => inside(i, x, y)) && !R.exc.some(i => inside(i, x, y))) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      const m = 10;   // margin for the outline
      return (_boxCache[id] = { x: x0 - m, y: y0 - m, w: x1 - x0 + 2 * m, h: y1 - y0 + 2 * m });
    }

    // Draws just the region (fill + the outline of the circle edges that bound it)
    function regionContent(id, p) {
      const R = REGIONS[id];
      const circ = (i, extra) =>
        `<circle cx="${CIRCLE_GEOM[i].cx}" cy="${CIRCLE_GEOM[i].cy}" r="230" ${extra}/>`;
      const defs =
        R.inc.map((i, k) => `<clipPath id="${p}-in${k}">${circ(i, '')}</clipPath>`).join('') +
        (R.exc.length
          ? `<mask id="${p}-ex" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="800">
               <rect x="0" y="0" width="900" height="800" fill="#fff" />
               ${R.exc.map(i => circ(i, 'fill="#000"')).join('')}
             </mask>`
          : '');
      const inner =
        `<rect x="0" y="0" width="900" height="800" fill="${R.color}" fill-opacity="0.35" />` +
        [0, 1].map(i => circ(i, `fill="none" stroke="${CIRCLE_STROKES[i]}" stroke-width="20"`)).join('');
      let body = R.exc.length ? `<g mask="url(#${p}-ex)">${inner}</g>` : inner;
      for (let k = R.inc.length - 1; k >= 0; k--) body = `<g clip-path="url(#${p}-in${k})">${body}</g>`;
      return `<defs>${defs}</defs>${body}`;
    }

    // Region of the big diagram (viewBox units) that the slide icon represents
    function regionFor(id) {
      const c = CIRCLES[id];
      if (c) return { x: c.cx - 235, y: c.cy - 235, w: 470, h: 470 };
      if (REGIONS[id]) return regionBox(id);
      return ICON_REGION;
    }

    function iconHtml(id) {
      const c = CIRCLES[id];
      const r = regionFor(id);
      if (c) {
        return `
      <svg viewBox="${r.x} ${r.y} ${r.w} ${r.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="${c.cx}" cy="${c.cy}" r="230" fill="${c.fill}" stroke="${c.stroke}" stroke-width="14" />
      </svg>`;
      }
      if (REGIONS[id]) {
        return `
      <svg viewBox="${r.x} ${r.y} ${r.w} ${r.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        ${regionContent(id, 'ic')}
      </svg>`;
      }
      return iconSvg;
    }

    const slides = {
      circle_health: {
        accent: "#c084fc",
        title: "Klinisk helsepsykologi",
        pages: [
          { title: "Somatisk-psykisk komorbiditet", visual: miniVenn },
          {
            title: "Eksempler",
            list: [
              "Kronisk <u>smerte</u> komorbid med alvorlig <u>depressiv</u> lidelse",
              "Kronisk <u>søvnforstyrrelse</u> komorbid med generalisert <u>angst</u>lidelse",
              "Traume etter <u>medisinsk prosedyre</u> komorbid med <u>PTSD</u>"
            ]
          },
          {
            title: "Spesialisering i klinisk helsepsykologi",
            list: [
              '<a href="https://www.psykologforeningen.no/kurs-og-utdanning/obligatorisk-program/klinisk-helsepsykologi-3" target="_blank" rel="noopener">Ny spesialisering</a>, færre enn 10 uteksaminerte spesialister i Norge',
              'I Sverige: 18 uteksaminerte spesialister (inkludert meg)',
              "Vitenskapsbasert, helhetlig tilnærming",
              "Fokus på kroniske tilstander og somatisk-psykiske komorbiditeter"
            ]
          },
          {
            title: "Helsepsykologi utenfor spesialiseringen",
            list: [
              "Noen psykologer har allerede erfaring med fagfeltet",
              'For eksempel ved høyspesialiserte enheter som:' +
              '<ul class="slide-sublist">' +
              '<li>Smerteklinikker</li>' +
              '<li>Søvnsentre</li>' +
              '<li>Rehabiliterings- og habiliteringssentre</li>' +
              '</ul>'
            ]
          },
          {
            title: "Pasienter uten tilbud",
            visual: '<img src="ToStoler.png" alt="Pasienter uten tilbud – To stoler" class="slide-img" />'
          }
        ]
      },
      circle_kap: {
        accent: "#f472b6",
        title: "Ketaminassistert psykoterapi (KAP)",
        pages: [
          { title: "Oversikt", text: "En ny behandlingsform som kombinerer subanestetiske ketamininfusjoner med strukturerte psykoterapitimer for raskt å behandle behandlingsresistent depresjon (TRD) og andre refraktære tilstander." },
          { title: "Slik fungerer det", text: "Eksempelslide: plassholdertekst som forklarer mekanismen og strukturen i en KAP-økt." },
          { title: "Sikkerhet og screening", text: "Eksempelslide: plassholdertekst om screening, overvåking og sikkerhetsvurderinger." }
        ]
      },
      psyk: {
        accent: "#a855f7",
        title: "Klinisk helsepsykologi i praksis",
        logo: "ACL.png",
        pages: [
          {
            title: "Egne erfaringer fra Vest-Sverige",
            list: [
              "<strong>2018:</strong> Et lite FoU-prosjekt innen helsepsykologi",
              "<strong>2019:</strong> Tilbød skreddersydd psykologisk behandling for spesifikke somatiske komorbiditeter ved noen få lokale helsesentre",
              '<strong>Kort tid etter:</strong> Massiv økning i:' +
              '<ul class="slide-sublist">' +
              '<li>Antall pasienter</li>' +
              '<li>Bredde og variasjon i somatiske tilstander</li>' +
              '<li>Samarbeidende sentre (over 18 helsesentre)</li>' +
              '</ul>',
              '<strong>Noen få år senere:</strong> Det største knutepunktet i sitt slag i Vest-Sverige, med over 20 initiativer og RCT-studier' +
              '<div style="margin-top: 0.6rem; font-size: 1.05rem; line-height: 1.6; color: #cbd5e1;">' +
              'Eksempler fra i år:' +
              '<ul class="slide-sublist">' +
              '<li><a href="https://www.jmir.org/2026/1/e86792/" target="_blank" rel="noopener">JMIR Vol28 (2026)</a>, som kombinerer fysioterapi og CBT for kronisk smerte</li>' +
              '<li><a href="https://formative.jmir.org/2026/1/e81285" target="_blank" rel="noopener">JMIR Formative Research Vol10 (2026)</a>, om blandet CBT og ACT for insomni</li>' +
              '<li><a href="https://gup.ub.gu.se/publication/359583" target="_blank" rel="noopener">Under publisering</a>, om blandet ACT for migrene</li>' +
              '</ul>' +
              '</div>',
              '<strong>2025:</strong> Solli DPS ansatte meg for å hjelpe med et lignende insomniprogram, starten på min norske reise'
            ]
          },
        ]
      },
      emma: {
        accent: "#ec4899",
        title: "EmmaSofia",
        logo: "EmmaSofia.png",
        pages: [
          {
            title: "Konkret forslag",
            ordered: "none",
            list: [
              '<button type="button" class="slide-link" onclick="jumpTo(\'axon\', 1)">(#1)</button> Skikkelig innføring av behandling (med eller uten KAP) for somatiske komorbiditeter i EmmaSofia'
            ]
          }
        ]
      },
      axon: {
        accent: "#c084fc",
        title: "Senter for smerte og helsepsykologi",
        pages: [
          {
            title: "Eksempler",
            list: [
              'Tverrfaglig behandling for somatiske tilstander:' +
              '<ul class="slide-sublist">' +
              '<li>Kroniske smerter og komorbid depresjon/angst</li>' +
              '<li>Langvarige plager og hodepine</li>' +
              '<li>Kombinasjon av evidensbasert helsepsykologi og KAP</li>' +
              '</ul>'
            ]
          },
          {
            title: "Forslag #1",
            ordered: "alpha",
            list: [
              "EmmaSofia legger somatiske komorbiditeter til i sin liste over tilstander",
              'Relevante sider beskriver helhetlig psykoterapi:' +
              '<ul class="slide-sublist">' +
              '<li>hvis den somatiske tilstanden er komorbid med kvalifiserende depresjon, tilbys KAP</li>' +
              '<li>ellers tilbys spesialisert behandling fra helsepsykologi</li>' +
              '</ul>',
              'Internt samarbeid:' +
              '<ul class="slide-sublist">' +
              '<li>et ukentlig fagmøte settes opp</li>' +
              '<li>et internt henvisningssystem</li>' +
              '</ul>'
            ]
          },
          {
            title: "Forslag #1 – plan",
            ordered: "decimal",
            list: [
              "Drøfte gjennomførbarhet og juridisk rammeverk for KAP ved somatisk komorbiditet",
              'Avhengig av (1) setter ACL sammen en mal for siden:' +
              '<ul class="slide-sublist slide-sublist-plain">' +
              '<li>klinisk helsepraksis med eller uten KAP</li>' +
              '</ul>',
              "Nettsiden oppdateres",
              "Parallelt med (3) oppdaterer teamet og ACL den kliniske arbeidsflyten"
            ]
          }
        ]
      }
    };

    const stage = document.getElementById('stage');
    const slideEl = document.getElementById('slide');
    const diagramWrap = document.getElementById('diagramWrap');
    const bigSvg = diagramWrap.querySelector('svg');
    let _activeId = null;
    let _page = 0;
    let _busy = false;

    const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
    const duration = () =>
      window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700;

    function setHighlight(id, on) {
      const group = document.getElementById('node-' + id);
      if (!group) return;
      // Exclude circles inside <defs> (clipPath circles)
      const circle = [...group.querySelectorAll('circle')].find(c => !c.closest('defs'));
      const rect = group.querySelector('rect');

      if (circle) {
        // Logo / circular node — highlight the circle border
        if (on) {
          circle._origStroke = circle.getAttribute('stroke');
          circle._origStrokeWidth = circle.getAttribute('stroke-width');
          circle.setAttribute('stroke', '#ffffff');
          circle.setAttribute('stroke-width', '5');
          circle.setAttribute('filter', 'url(#glow)');
        } else {
          circle.setAttribute('stroke', circle._origStroke || '#3b82f6');
          circle.setAttribute('stroke-width', circle._origStrokeWidth || '2.5');
          circle.removeAttribute('filter');
        }
      } else if (rect) {
        if (group.classList.contains('logo-node')) {
          // Capsule badge (e.g. Senter for smerte og helsepsykologi)
          if (on) {
            rect._origStroke = rect.getAttribute('stroke');
            rect._origStrokeWidth = rect.getAttribute('stroke-width');
            rect.setAttribute('stroke', '#ffffff');
            rect.setAttribute('stroke-width', '4');
            rect.setAttribute('filter', 'url(#glow)');
          } else {
            rect.setAttribute('stroke', rect._origStroke || '#c084fc');
            rect.setAttribute('stroke-width', rect._origStrokeWidth || '2');
            rect.removeAttribute('filter');
          }
        } else {
          // Text-only title label — toggle the highlight rect
          rect.setAttribute('opacity', on ? '1' : '0');
        }
      }
    }

    function renderSlide(id, pageIndex, animate) {
      const s = slides[id];
      const page = s.pages[pageIndex];
      const isFirst = pageIndex === 0;
      const isLast = pageIndex === s.pages.length - 1;
      const multi = s.pages.length > 1;

      // Every slide: section title on the small line, slide title as the big heading.
      const eyebrow = `<p class="slide-eyebrow">${s.title}</p>`;
      const listTag = page.ordered ? 'ol' : 'ul';
      const body = page.visual
        ? `<div class="slide-visual">${page.visual}</div>`
        : (page.text ? `<p class="slide-body">${page.text}</p>` : '') +
        (page.list ? `<${listTag} class="slide-list${page.ordered ? ' slide-list-' + page.ordered : ''}">${page.list.map(item => `<li>${item}</li>`).join('')}</${listTag}>` : '') +
        (page.after ? `<p class="slide-body slide-after">${page.after}</p>` : '');

      // Prev / Next when the topic has several pages; the last page ends with "Return to diagram"
      const nextBtn = isLast
        ? `<button onclick="closeSlide()" aria-label="Tilbake til diagrammet" title="Tilbake til diagrammet">&#8617;</button>`
        : `<button onclick="nextPage()" aria-label="Neste lysbilde" title="Neste lysbilde">&rarr;</button>`;
      const nav = multi ? `
          <footer class="slide-nav">
            <button onclick="prevPage()" aria-label="Forrige lysbilde" title="Forrige lysbilde" style="visibility:${isFirst ? 'hidden' : 'visible'}">&larr;</button>
            ${nextBtn}
          </footer>` : `
          <footer class="slide-nav slide-nav-end">
            ${nextBtn}
          </footer>`;

      slideEl.innerHTML = `
        <article class="slide-card" style="--accent:${s.accent}">
          <header class="slide-head">
            <button class="slide-icon" onclick="closeSlide()" aria-label="Tilbake til diagrammet" title="Tilbake til diagrammet">${iconHtml(id)}</button>
            <div>
              ${eyebrow}
              <h2 class="slide-title">${page.title}</h2>
            </div>
          </header>
          <div class="slide-content-area">
            ${body}
          </div>
          ${nav}
        </article>`;

      // Safeguard: every external link opens in a new tab
      slideEl.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      });

      if (animate && duration()) {
        slideEl.firstElementChild.animate(
          [{ opacity: 0 }, { opacity: 1 }],
          { duration: 250, easing: 'ease-out' }
        );
      }
    }

    /* Transform that maps a region of the big diagram onto the small icon */
    function shrinkTransform(region) {
      const iconEl = slideEl.querySelector('.slide-icon svg');
      const r = bigSvg.getBoundingClientRect();
      const wr = diagramWrap.getBoundingClientRect();
      const viewBox = bigSvg.viewBox.baseVal;
      const sx = r.width / viewBox.width, sy = r.height / viewBox.height;
      const regionW = region.w * sx;
      const regionH = region.h * sy;
      const cx = r.left + (region.x - viewBox.x + region.w / 2) * sx;
      const cy = r.top + (region.y - viewBox.y + region.h / 2) * sy;
      const ir = iconEl.getBoundingClientRect();
      const icx = ir.left + ir.width / 2;
      const icy = ir.top + ir.height / 2;
      // Icon preserves aspect ratio, so its scale is limited by the smaller side
      const scale = Math.min(ir.width / regionW, ir.height / regionH);
      return {
        origin: `${cx - wr.left}px ${cy - wr.top}px`,
        transform: `translate(${icx - cx}px, ${icy - cy}px) scale(${scale})`
      };
    }

    /* Everything in the diagram that should fade away so only the related part remains.
       Main circles: all except the chosen circle. Logo / intersection nodes: everything
       (a separate copy of just their region, the "proxy", takes over and shrinks into the icon). */
    function otherParts(id) {
      const kids = [...bigSvg.children].filter(el =>
        el.tagName.toLowerCase() !== 'defs' && !el.classList.contains('region-proxy'));
      const c = CIRCLES[id];
      if (c) {
        const keep = [...bigSvg.querySelectorAll(':scope > circle')][c.idx];
        return kids.filter(el => el !== keep);
      }
      return kids;
    }

    // For logo / intersection nodes: a copy of just their region, drawn on top of the diagram
    function addProxy(id, keyframes, ms) {
      if (!REGIONS[id]) return null;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'region-proxy');
      g.setAttribute('pointer-events', 'none');
      g.innerHTML = regionContent(id, 'px');
      bigSvg.appendChild(g);
      g.animate(keyframes, { duration: ms, easing: 'linear', fill: 'forwards' });
      return g;
    }

    function showInfo(id) {
      if (_busy || _activeId) return;
      _busy = true;
      _activeId = id;
      _page = 0;
      setHighlight(id, true);
      renderSlide(id, _page, false);
      stage.classList.add('has-slide');

      const t = shrinkTransform(regionFor(id));
      diagramWrap.style.pointerEvents = 'none';
      diagramWrap.style.transformOrigin = t.origin;

      // The other two circles (and all labels / logos) fade away early
      const fades = otherParts(id).map(el =>
        el.animate([{ opacity: 1 }, { opacity: 0 }],
          { duration: duration() * 0.4, easing: 'ease-out', fill: 'forwards' })
      );

      const proxy = addProxy(id, [{ opacity: 0 }, { opacity: 1 }], duration() * 0.4);

      // Diagram shrinks into the icon position, then fades out as the icon fades in
      const anim = diagramWrap.animate(
        [
          { transform: 'none', opacity: 1 },
          { opacity: 1, offset: 0.55 },
          { transform: t.transform, opacity: 0 }
        ],
        { duration: duration(), easing: EASE, fill: 'forwards' }
      );
      const icon = slideEl.querySelector('.slide-icon');
      if (icon && duration()) {
        icon.animate([{ opacity: 0 }, { opacity: 1 }],
          { duration: duration() * 0.45, delay: duration() * 0.45, easing: 'ease-out', fill: 'backwards' });
      }
      anim.onfinish = () => {
        diagramWrap.classList.add('diagram-hidden');
        anim.cancel();
        fades.forEach(a => a.cancel());
        if (proxy) proxy.remove();
        diagramWrap.style.pointerEvents = '';
        diagramWrap.style.transformOrigin = '';
        _busy = false;
      };
    }

    function closeSlide() {
      if (_busy || !_activeId) return;
      _busy = true;
      const id = _activeId;
      const t = shrinkTransform(regionFor(id));   // measure while the slide is still there
      setHighlight(id, false);
      _activeId = null;

      diagramWrap.classList.remove('diagram-hidden');
      diagramWrap.style.pointerEvents = 'none';
      diagramWrap.style.transformOrigin = t.origin;
      stage.classList.remove('has-slide');   // slide fades out (its content stays until faded)

      // The other two circles (and labels / logos) fade back in during the second half
      otherParts(id).forEach(el =>
        el.animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1 }],
          { duration: duration(), easing: 'linear' })
      );

      const proxy = addProxy(id, [{ opacity: 1 }, { opacity: 1, offset: 0.5 }, { opacity: 0 }], duration());

      // Icon grows back into the full diagram
      const anim = diagramWrap.animate(
        [
          { transform: t.transform, opacity: 0 },
          { opacity: 1, offset: 0.45 },
          { transform: 'none', opacity: 1 }
        ],
        { duration: duration(), easing: EASE }
      );
      anim.onfinish = () => {
        if (proxy) proxy.remove();
        diagramWrap.style.pointerEvents = '';
        diagramWrap.style.transformOrigin = '';
        _busy = false;
      };
    }

    // Jump straight to a page of another topic (used by the (#1) / (#2) links)
    function jumpTo(id, page) {
      if (_busy || !_activeId || !slides[id]) return;
      setHighlight(_activeId, false);
      _activeId = id;
      _page = page || 0;
      setHighlight(id, true);
      renderSlide(id, _page, true);
    }

    function nextPage() {
      if (!_activeId || _busy) return;
      if (_page < slides[_activeId].pages.length - 1) {
        _page++;
        renderSlide(_activeId, _page, true);
      }
    }

    function prevPage() {
      if (!_activeId || _busy || _page === 0) return;
      _page--;
      renderSlide(_activeId, _page, true);
    }

    // Click on empty space (outside diagram and slide) closes the slide
    stage.addEventListener('click', e => {
      if (!e.target.closest('svg, .slide-card')) closeSlide();
    });

    // Keyboard: Esc closes, → next page, ← previous page
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSlide();
      else if (e.key === 'ArrowRight') nextPage();
      else if (e.key === 'ArrowLeft') prevPage();
    });
  </script>
