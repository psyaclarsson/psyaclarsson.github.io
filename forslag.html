<!DOCTYPE html>
<html lang="nb">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forslag</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ---------- Stage: diagram and slide share the same cell ---------- */
    .stage {
      width: 100%;
      max-width: 1400px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 1rem;
      box-sizing: border-box;
      display: grid;
      place-items: center;
    }

    .diagram-wrap,
    .slide-wrap {
      grid-area: 1 / 1;
    }

    .diagram-wrap {
      width: 100%;
      max-width: 800px;
    }

    .diagram-wrap.diagram-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .diagram-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
    }

    .slide-wrap {
      width: 100%;
      max-width: 720px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0s linear 0.35s;
    }

    .stage.has-slide .slide-wrap {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.35s ease 0.15s, visibility 0s;
    }

    .slide {
      box-sizing: border-box;
      padding: 0.5rem 0;
    }

    /* ---------- Slide card ---------- */
    .slide-card {
      --accent: #38bdf8;
      position: relative;
      background: #1e293b;
      border: 1px solid #334155;
      border-top: 4px solid var(--accent);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
    }

    .slide-head {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    /* Mini icon of the diagram: click to go back to the diagram */
    .slide-icon {
      flex: none;
      width: 60px;
      height: 58px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 0.5rem;
      transition: transform 0.2s ease;
    }

    .slide-icon:hover {
      transform: scale(1.08);
    }

    .slide-icon:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .slide-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .slide-logo {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: contain;
      background: #0f172a;
      border: 2.5px solid var(--accent);
    }

    .slide-eyebrow {
      margin: 0 0 0.25rem 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .slide-title {
      margin: 0;
      font-size: clamp(1.4rem, 2.3vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }

    .slide-body {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.65;
      color: #cbd5e1;
    }

    .slide-body a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .slide-body a:hover {
      color: #f8fafc;
    }

    .slide-body+.slide-list {
      margin-top: 1rem;
    }

    .slide-list+.slide-after {
      margin-top: 1.25rem;
    }

    .slide-body u,
    .slide-list u {
      text-underline-offset: 3px;
    }

    .slide-indent {
      display: inline-block;
      margin: 0.5rem 0 0 1.4rem;
      color: #f8fafc;
    }

    .slide-list {
      margin: 0;
      padding-left: 1.4rem;
      font-size: 1.1rem;
      line-height: 1.65;
      color: #cbd5e1;
    }

    .slide-body strong,
    .slide-list strong {
      color: #f8fafc;
    }

    .slide-list li {
      margin-bottom: 0.75rem;
    }

    /* Ordered lists: labels generated by the browser, e.g. (a) (b) (c) or (1) (2) (3) */
    @counter-style paren-alpha {
      system: extends lower-alpha;
      prefix: "(";
      suffix: ") ";
    }

    @counter-style paren-decimal {
      system: extends decimal;
      prefix: "(";
      suffix: ") ";
    }

    .slide-list-none {
      list-style: none;
      padding-left: 0;
    }

    .slide-link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--accent);
      font: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .slide-link:hover {
      color: #f8fafc;
    }

    .slide-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .slide-list-alpha {
      list-style: paren-alpha;
      padding-left: 2.4rem;
    }

    .slide-list-decimal {
      list-style: paren-decimal;
      padding-left: 2.4rem;
    }

    .slide-sublist {
      margin: 0.6rem 0 0 0;
      padding-left: 1.2rem;
      list-style: circle;
    }

    .slide-sublist-plain {
      list-style: none;
    }

    .slide-sublist li {
      margin-bottom: 0.5rem;
    }

    .slide-list a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .slide-list a:hover {
      color: #f8fafc;
    }

    .slide-list li::marker {
      color: var(--accent);
    }

    .slide-visual {
      text-align: center;
    }

    .slide-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid #334155;
      color: #64748b;
      font-size: 0.85rem;
    }

    .slide-nav-end {
      justify-content: flex-end;
    }

    .slide-nav button {
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      border-radius: 0.5rem;
      padding: 0.4rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .slide-nav button:hover {
      border-color: var(--accent);
      color: #f8fafc;
    }

    /* ---------- Diagram text styles ---------- */
    .label-pill {
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
      paint-order: stroke fill;
      stroke: #0f172a;
      stroke-width: 4px;
    }

    .dir-title {
      font-size: 13px;
      font-weight: 700;
      fill: #f8fafc;
      pointer-events: none;
      paint-order: stroke fill;
      stroke: #0f172a;
      stroke-width: 3px;
    }

    /* ---------- Two-circle Venn inside the Health Psychology slide ---------- */
    .mini-venn {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      margin: 0 auto;
    }

    .blended-venn {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      margin: 0 auto;
    }

    .mini-label {
      font-size: 16px;
      font-weight: 700;
    }

    .mini-overlap {
      font-size: 13px;
      font-weight: 700;
      fill: #f5d0fe;
    }

    @media (max-width: 899px) {
      .slide-card {
        padding: 1.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .slide-wrap,
      .stage.has-slide .slide-wrap,
      .slide-icon {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="stage" id="stage">

    <div class="diagram-wrap" id="diagramWrap">
      <!-- Venn Diagram SVG -->
      <svg viewBox="0 0 900 730" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Three Main Intersecting Circles -->
        <!-- Circle 1: Blended Psychology (Top Left) -->
        <circle cx="360" cy="300" r="210" fill="rgba(59, 130, 246, 0.18)" stroke="#3b82f6" stroke-width="2.5" />

        <!-- Circle 2: Health Psychology (Top Right) -->
        <circle cx="540" cy="300" r="210" fill="rgba(168, 85, 247, 0.18)" stroke="#a855f7" stroke-width="2.5" />

        <!-- Circle 3: Ketamine-Assisted (Bottom) -->
        <circle cx="450" cy="460" r="210" fill="rgba(236, 72, 153, 0.18)" stroke="#ec4899" stroke-width="2.5" />

        <!-- Main Category Labels Outside Circles -->
        <g id="node-circle_blended" onclick="showInfo('circle_blended')" style="cursor:pointer"
          transform="rotate(-45, 200, 140)">
          <rect x="85" y="122" width="230" height="26" rx="6" fill="none" stroke="#ffffff" stroke-width="2.5"
            opacity="0" pointer-events="none" />
          <text x="200" y="140" text-anchor="middle" class="label-pill" fill="#60a5fa">Blandet klinisk psykologi</text>
        </g>

        <g id="node-circle_health" onclick="showInfo('circle_health')" style="cursor:pointer"
          transform="rotate(45, 700, 140)">
          <rect x="595" y="122" width="210" height="26" rx="6" fill="none" stroke="#ffffff" stroke-width="2.5"
            opacity="0" pointer-events="none" />
          <text x="700" y="140" text-anchor="middle" class="label-pill" fill="#c084fc">Klinisk helsepsykologi</text>
        </g>

        <g id="node-circle_kap" onclick="showInfo('circle_kap')" style="cursor:pointer">
          <rect x="325" y="685" width="250" height="26" rx="6" fill="none" stroke="#ffffff" stroke-width="2.5"
            opacity="0" pointer-events="none" />
          <text x="450" y="705" text-anchor="middle" class="label-pill" fill="#f472b6">Ketaminassistert
            psykoterapi</text>
        </g>

        <!-- Logo: DrDropin — Pure Blended Psychology -->
        <g id="node-dropin" class="logo-node" onclick="showInfo('dropin')" style="cursor:pointer">
          <defs>
            <clipPath id="clip-dropin">
              <circle cx="267" cy="207" r="34" />
            </clipPath>
          </defs>
          <circle cx="267" cy="207" r="34" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" />
          <image href="DrDropin.png" x="233" y="173" width="68" height="68" clip-path="url(#clip-dropin)"
            preserveAspectRatio="xMidYMid meet" />
        </g>

        <!-- Logo: PsykologForeningen — Pure Health Psychology -->
        <g id="node-psyk" class="logo-node" onclick="showInfo('psyk')" style="cursor:pointer">
          <defs>
            <clipPath id="clip-psyk">
              <circle cx="633" cy="207" r="34" />
            </clipPath>
          </defs>
          <circle cx="633" cy="207" r="34" fill="#1e293b" stroke="#a855f7" stroke-width="2.5" />
          <image href="ACL.png" x="599" y="173" width="68" height="68" clip-path="url(#clip-psyk)"
            preserveAspectRatio="xMidYMid meet" />
        </g>

        <!-- Logo: EmmaSofia — Pure Ketamine-Assisted -->
        <g id="node-emma" class="logo-node" onclick="showInfo('emma')" style="cursor:pointer">
          <defs>
            <clipPath id="clip-emma">
              <circle cx="450" cy="568" r="34" />
            </clipPath>
          </defs>
          <circle cx="450" cy="568" r="34" fill="#1e293b" stroke="#ec4899" stroke-width="2.5" />
          <image href="EmmaSofia.png" x="416" y="534" width="68" height="68" clip-path="url(#clip-emma)"
            preserveAspectRatio="xMidYMid meet" />
        </g>

        <!-- Logo: Axon Klinikken — Ketamine + Health -->
        <g id="node-axon" class="logo-node" onclick="showInfo('axon')" style="cursor:pointer">
          <defs>
            <clipPath id="clip-axon">
              <circle cx="597" cy="435" r="34" />
            </clipPath>
          </defs>
          <circle cx="597" cy="435" r="34" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" />
          <image href="Axon.png" x="563" y="401" width="68" height="68" clip-path="url(#clip-axon)"
            preserveAspectRatio="xMidYMid meet" />
        </g>

        <!-- Logo: Solli DPS — Blended + Health -->
        <g id="node-solli" class="logo-node" onclick="showInfo('solli')" style="cursor:pointer">
          <defs>
            <clipPath id="clip-solli">
              <circle cx="450" cy="169" r="34" />
            </clipPath>
          </defs>
          <circle cx="450" cy="169" r="34" fill="#1e293b" stroke="#60a5fa" stroke-width="2.5" />
          <image href="SolliDPS.png" x="416" y="135" width="68" height="68" clip-path="url(#clip-solli)"
            preserveAspectRatio="xMidYMid meet" />
        </g>

        <!-- Intersection: Blended Psychology + Ketamine-Assisted = Blended KAP -->
        <g id="node-blendedkap" class="logo-node" onclick="showInfo('blendedkap')" style="cursor:pointer">
          <circle cx="303" cy="435" r="40" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" />
          <text x="303" y="428" text-anchor="middle" class="dir-title" fill="#a5b4fc">Blandet</text>
          <text x="303" y="444" text-anchor="middle" class="dir-title" fill="#a5b4fc">KAP</text>
        </g>

        <!-- Intersection: All Three = Blended Interdisciplinary KAP -->
        <g id="node-interdiscip" class="logo-node" onclick="showInfo('interdiscip')" style="cursor:pointer">
          <circle cx="450" cy="368" r="44" fill="#1e293b" stroke="#f0abfc" stroke-width="2.5" />
          <text x="450" y="357" text-anchor="middle" class="dir-title" fill="#f5d0fe">Blandet</text>
          <text x="450" y="372" text-anchor="middle" class="dir-title" fill="#f5d0fe">Tverrfaglig</text>
          <text x="450" y="387" text-anchor="middle" class="dir-title" fill="#f5d0fe">KAP</text>
        </g>
      </svg>
    </div>

    <!-- Slide area: empty until something is selected -->
    <aside class="slide-wrap" aria-live="polite">
      <div class="slide" id="slide"></div>
    </aside>

  </main>

  <script>
    /* ------------------------------------------------------------------
       Slides — one entry per clickable. Each topic has a list of `pages`.
       Add more objects to `pages` to give a topic more slides.
       Every page needs a `title` (the slide title, big heading; the topic `title` is shown on the small line above it)
       and can have `text`, `list` (array of bullet points), or `visual` (custom markup).
       `logo` is optional.
       ------------------------------------------------------------------ */
    const miniVenn = `
      <svg class="mini-venn" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-label="Venndiagram: Somatisk og psykisk overlapper i somatisk-psykisk komorbiditet">
        <defs>
          <clipPath id="mini-clip-somatic">
            <circle cx="140" cy="130" r="120" />
          </clipPath>
        </defs>
        <circle cx="140" cy="130" r="120" fill="rgba(168, 85, 247, 0.22)" stroke="#a855f7" stroke-width="2.5" />
        <circle cx="260" cy="130" r="120" fill="rgba(56, 189, 248, 0.22)" stroke="#38bdf8" stroke-width="2.5" />
        <circle cx="260" cy="130" r="120" fill="rgba(240, 171, 252, 0.28)" clip-path="url(#mini-clip-somatic)" />
        <text x="80" y="135" text-anchor="middle" class="mini-label" fill="#c084fc">Somatisk</text>
        <text x="320" y="135" text-anchor="middle" class="mini-label" fill="#7dd3fc">Psykisk</text>
        <text class="mini-overlap" text-anchor="middle">
          <tspan x="200" y="115">Somatisk-</tspan>
          <tspan x="200" y="132">psykisk</tspan>
          <tspan x="200" y="149">komorbiditet</tspan>
        </text>
      </svg>`;

    /* Round logo inside the Digital circle; shows a short text label if the image is missing */
    const bvLogo = (id, cx, cy, r, src, fallback) => `
        <clipPath id="bv-clip-${id}"><circle cx="${cx}" cy="${cy}" r="${r}" /></clipPath>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="#1e293b" stroke="#7dd3fc" stroke-width="2" />
        <text x="${cx}" y="${cy + 3}" text-anchor="middle" font-size="8" font-weight="700" fill="#94a3b8" display="none">${fallback}</text>
        <image href="${src}" x="${cx - r}" y="${cy - r}" width="${2 * r}" height="${2 * r}" clip-path="url(#bv-clip-${id})"
          preserveAspectRatio="xMidYMid meet" onerror="this.previousElementSibling.removeAttribute('display')" />`;

    /* Blended Clinical Psychology: Physical / Digital Venn, built up one step per slide.
       `o` says which parts to draw. Positions are the same on every slide so parts do not jump. */
    const bvSvg = o => {
      const text = (x, y, size, fill, txt, extra = '') =>
        `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${fill}" ${extra}>${txt}</text>`;
      const badge = (cx, cy, stroke, txt, size) =>
        `<circle cx="${cx}" cy="${cy}" r="25" fill="#1e293b" stroke="${stroke}" stroke-width="2" />` +
        text(cx, cy + (size >= 12 ? 5 : 4), size, '#f8fafc', txt);
      const g = [];
      if (o.physical) g.push('<circle cx="235" cy="230" r="165" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="2.5" />');
      if (o.digital) g.push('<circle cx="435" cy="230" r="165" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2.5" />');
      if (o.oval) g.push('<ellipse cx="435" cy="230" rx="165" ry="80" fill="rgba(248, 250, 252, 0.08)" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="8 7" />');
      if (o.physical) g.push(text(235, 44, 20, '#93c5fd', 'Fysisk'));
      if (o.digital) g.push(text(435, 44, 20, '#7dd3fc', 'Digital'));
      if (o.blended) g.push(text(335, 236, 17, '#f8fafc', 'Blandet'));
      if (o.oval) g.push(text(435, 141, 14, '#e2e8f0', 'Integrert', 'letter-spacing="0.5"'));
      if (o.physLogos) {
        g.push(badge(175, 160, '#93c5fd', 'CBT-X', 11));
        g.push(badge(175, 300, '#93c5fd', 'CBT', 13));
      }
      if (o.qMarks) {
        g.push(text(340, 208, 30, '#cbd5e1', '?'));
        g.push(text(498, 206, 30, '#cbd5e1', '?'));
      }
      if (o.bCBT) g.push(badge(340, 198, '#e2e8f0', o.bCBT, o.bCBT === '?' ? 18 : 12));
      if (o.iCBT) g.push(badge(498, 196, '#7dd3fc', o.iCBT, o.iCBT === '?' ? 18 : 13));
      if (o.digLogos) {
        g.push(bvLogo('dropin', 498, 266, 25, 'DrDropin.png', 'DrDropin'));
        g.push(bvLogo('emma', 394, 346, 25, 'EmmaSofia.png', 'EmmaSofia'));
        g.push(bvLogo('vurdering', 450, 346, 25, 'vurdering.png', 'vurdering'));
        g.push(badge(506, 346, '#7dd3fc', 'selvhjelp', 10));
      }
      // Evidence line and its labels, on the left of the diagram
      const line = o.line ? `
        <line x1="10" y1="230" x2="730" y2="230" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 7" />
        <text x="160" y="190" text-anchor="end" font-size="15" font-weight="700" fill="#f8fafc">Evidensbasert /</text>
        <text x="160" y="209" text-anchor="end" font-size="15" font-weight="700" fill="#f8fafc">Spesialisert</text>
        <text x="160" y="256" text-anchor="end" font-size="15" font-weight="700" fill="#94a3b8">Ikke evidensbasert</text>
        <text x="160" y="275" text-anchor="end" font-size="15" font-weight="700" fill="#94a3b8">eller spesialisert</text>` : '';
      return `
      <svg class="blended-venn" viewBox="0 0 740 440" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-label="Diagram over fysisk og digital klinisk psykologi, bygget opp steg for steg">
        <g transform="translate(110 0)">${g.join('\n')}</g>${line}
      </svg>`;
    };

    /* The seven build steps of the diagram */
    const bvSteps = [
      { physical: 1, digital: 1, blended: 1 },
      { digital: 1, digLogos: 1 },
      { digital: 1, digLogos: 1, oval: 1 },
      { physical: 1, line: 1, physLogos: 1 },
      { physical: 1, digital: 1, line: 1, physLogos: 1, digLogos: 1, qMarks: 1 },
      { physical: 1, digital: 1, line: 1, physLogos: 1, digLogos: 1, oval: 1, qMarks: 1 },
      { physical: 1, digital: 1, line: 1, physLogos: 1, digLogos: 1, oval: 1, ovalLabel: 1, bCBT: 'bCBT', iCBT: 'iCBT' }
    ].map(bvSvg);

    /* Mini three-circle icon (same circles as the big diagram, cropped to the circles) */
    const ICON_REGION = { x: 150, y: 90, w: 600, h: 580 };   // in big-diagram viewBox units (900 x 730)
    const iconSvg = `
      <svg viewBox="${ICON_REGION.x} ${ICON_REGION.y} ${ICON_REGION.w} ${ICON_REGION.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="360" cy="300" r="210" fill="rgba(59, 130, 246, 0.18)" stroke="#3b82f6" stroke-width="14" />
        <circle cx="540" cy="300" r="210" fill="rgba(168, 85, 247, 0.18)" stroke="#a855f7" stroke-width="14" />
        <circle cx="450" cy="460" r="210" fill="rgba(236, 72, 153, 0.18)" stroke="#ec4899" stroke-width="14" />
      </svg>`;

    /* The three main circles: for these topics the slide icon is just that one circle
       (the other two are left out), and the diagram shrinks onto that circle. */
    const CIRCLES = {
      circle_blended: { idx: 0, cx: 360, cy: 300, fill: 'rgba(59, 130, 246, 0.18)', stroke: '#3b82f6' },
      circle_health: { idx: 1, cx: 540, cy: 300, fill: 'rgba(168, 85, 247, 0.18)', stroke: '#a855f7' },
      circle_kap: { idx: 2, cx: 450, cy: 460, fill: 'rgba(236, 72, 153, 0.18)', stroke: '#ec4899' }
    };

    /* The logo / intersection nodes: each marks one specific region of the Venn diagram.
       inc = circles the region is inside, exc = circles it must be outside of. */
    const CIRCLE_GEOM = [{ cx: 360, cy: 300 }, { cx: 540, cy: 300 }, { cx: 450, cy: 460 }];
    const CIRCLE_STROKES = ['#3b82f6', '#a855f7', '#ec4899'];
    const REGIONS = {
      dropin: { inc: [0], exc: [1, 2], color: '#3b82f6' },   // pure Blended
      psyk: { inc: [1], exc: [0, 2], color: '#a855f7' },   // pure Health
      emma: { inc: [2], exc: [0, 1], color: '#ec4899' },   // pure KAP
      axon: { inc: [1, 2], exc: [0], color: '#c084fc' },   // KAP + Health
      solli: { inc: [0, 1], exc: [2], color: '#60a5fa' },   // Blended + Health
      blendedkap: { inc: [0, 2], exc: [1], color: '#818cf8' },   // Blended + KAP
      interdiscip: { inc: [0, 1, 2], exc: [], color: '#f0abfc' }    // all three
    };

    // Bounding box of a region (in big-diagram units), found by sampling; cached
    const _boxCache = {};
    function regionBox(id) {
      if (_boxCache[id]) return _boxCache[id];
      const R = REGIONS[id];
      const inside = (i, x, y) => {
        const g = CIRCLE_GEOM[i];
        return (x - g.cx) ** 2 + (y - g.cy) ** 2 <= 210 * 210;
      };
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (let x = 100; x <= 800; x += 2) {
        for (let y = 60; y <= 700; y += 2) {
          if (R.inc.every(i => inside(i, x, y)) && !R.exc.some(i => inside(i, x, y))) {
            if (x < x0) x0 = x; if (x > x1) x1 = x;
            if (y < y0) y0 = y; if (y > y1) y1 = y;
          }
        }
      }
      const m = 10;   // margin for the outline
      return (_boxCache[id] = { x: x0 - m, y: y0 - m, w: x1 - x0 + 2 * m, h: y1 - y0 + 2 * m });
    }

    // Draws just the region (fill + the outline of the circle edges that bound it)
    function regionContent(id, p) {
      const R = REGIONS[id];
      const circ = (i, extra) =>
        `<circle cx="${CIRCLE_GEOM[i].cx}" cy="${CIRCLE_GEOM[i].cy}" r="210" ${extra}/>`;
      const defs =
        R.inc.map((i, k) => `<clipPath id="${p}-in${k}">${circ(i, '')}</clipPath>`).join('') +
        (R.exc.length
          ? `<mask id="${p}-ex" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="730">
               <rect x="0" y="0" width="900" height="730" fill="#fff" />
               ${R.exc.map(i => circ(i, 'fill="#000"')).join('')}
             </mask>`
          : '');
      const inner =
        `<rect x="0" y="0" width="900" height="730" fill="${R.color}" fill-opacity="0.35" />` +
        [0, 1, 2].map(i => circ(i, `fill="none" stroke="${CIRCLE_STROKES[i]}" stroke-width="20"`)).join('');
      let body = R.exc.length ? `<g mask="url(#${p}-ex)">${inner}</g>` : inner;
      for (let k = R.inc.length - 1; k >= 0; k--) body = `<g clip-path="url(#${p}-in${k})">${body}</g>`;
      return `<defs>${defs}</defs>${body}`;
    }

    // Region of the big diagram (viewBox units) that the slide icon represents
    function regionFor(id) {
      const c = CIRCLES[id];
      if (c) return { x: c.cx - 217, y: c.cy - 217, w: 434, h: 434 };
      if (REGIONS[id]) return regionBox(id);
      return ICON_REGION;
    }

    function iconHtml(id) {
      const c = CIRCLES[id];
      const r = regionFor(id);
      if (c) {
        return `
      <svg viewBox="${r.x} ${r.y} ${r.w} ${r.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="${c.cx}" cy="${c.cy}" r="210" fill="${c.fill}" stroke="${c.stroke}" stroke-width="14" />
      </svg>`;
      }
      if (REGIONS[id]) {
        return `
      <svg viewBox="${r.x} ${r.y} ${r.w} ${r.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        ${regionContent(id, 'ic')}
      </svg>`;
      }
      return iconSvg;
    }

    function setHighlight(id, on) {
      const group = document.getElementById('node-' + id);
      if (!group) return;
      // Exclude circles inside <defs> (clipPath circles)
      const circle = [...group.querySelectorAll('circle')].find(c => !c.closest('defs'));

      if (circle) {
        // Logo / intersection node — highlight the circle border
        if (on) {
          circle._origStroke = circle.getAttribute('stroke');
          circle._origStrokeWidth = circle.getAttribute('stroke-width');
          circle.setAttribute('stroke', '#ffffff');
          circle.setAttribute('stroke-width', '5');
          circle.setAttribute('filter', 'url(#glow)');
        } else {
          circle.setAttribute('stroke', circle._origStroke || '#3b82f6');
          circle.setAttribute('stroke-width', circle._origStrokeWidth || '2.5');
          circle.removeAttribute('filter');
        }
      } else {
        // Text-only label — toggle the highlight rect
        const rect = group.querySelector('rect');
        if (rect) rect.setAttribute('opacity', on ? '1' : '0');
      }
    }

    function renderSlide(id, pageIndex, animate) {
      const s = slides[id];
      const page = s.pages[pageIndex];
      const isFirst = pageIndex === 0;
      const isLast = pageIndex === s.pages.length - 1;
      const multi = s.pages.length > 1;

      const logo = s.logo
        ? `<img class="slide-logo" src="${s.logo}" alt="" onerror="this.style.display='none'">`
        : '';
      // Every slide: section title on the small line, slide title as the big heading.
      const eyebrow = `<p class="slide-eyebrow">${s.title}</p>`;
      const listTag = page.ordered ? 'ol' : 'ul';
      const body = page.visual
        ? `<div class="slide-visual">${page.visual}</div>`
        : (page.text ? `<p class="slide-body">${page.text}</p>` : '') +
        (page.list ? `<${listTag} class="slide-list${page.ordered ? ' slide-list-' + page.ordered : ''}">${page.list.map(item => `<li>${item}</li>`).join('')}</${listTag}>` : '') +
        (page.after ? `<p class="slide-body slide-after">${page.after}</p>` : '');

      // Prev / Next when the topic has several pages; the last page ends with "Return to diagram"
      const nextBtn = isLast
        ? `<button onclick="closeSlide()" aria-label="Tilbake til diagrammet" title="Tilbake til diagrammet">&#8617;</button>`
        : `<button onclick="nextPage()" aria-label="Neste lysbilde">Neste &rarr;</button>`;
      const nav = multi ? `
          <footer class="slide-nav">
            <button onclick="prevPage()" aria-label="Forrige lysbilde" style="visibility:${isFirst ? 'hidden' : 'visible'}">&larr; Forrige</button>
            <span>${pageIndex + 1} / ${s.pages.length}</span>
            ${nextBtn}
          </footer>` : `
          <footer class="slide-nav slide-nav-end">
            ${nextBtn}
          </footer>`;

      slideEl.innerHTML = `
        <article class="slide-card" style="--accent:${s.accent}">
          <header class="slide-head">
            <button class="slide-icon" onclick="closeSlide()" aria-label="Tilbake til diagrammet" title="Tilbake til diagrammet">${iconHtml(id)}</button>
            ${logo}
            <div>
              ${eyebrow}
              <h2 class="slide-title">${page.title}</h2>
            </div>
          </header>
          ${body}
          ${nav}
        </article>`;

      // Safeguard: every external link opens in a new tab
      slideEl.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      });

      if (animate && duration()) {
        slideEl.firstElementChild.animate(
          [{ opacity: 0 }, { opacity: 1 }],
          { duration: 250, easing: 'ease-out' }
        );
      }
    }

    /* Transform that maps a region of the big diagram onto the small icon */
    function shrinkTransform(region) {
      const iconEl = slideEl.querySelector('.slide-icon svg');
      const r = bigSvg.getBoundingClientRect();
      const wr = diagramWrap.getBoundingClientRect();
      const sx = r.width / 900, sy = r.height / 730;
      const regionW = region.w * sx;
      const regionH = region.h * sy;
      const cx = r.left + (region.x + region.w / 2) * sx;
      const cy = r.top + (region.y + region.h / 2) * sy;
      const ir = iconEl.getBoundingClientRect();
      const icx = ir.left + ir.width / 2;
      const icy = ir.top + ir.height / 2;
      // Icon preserves aspect ratio, so its scale is limited by the smaller side
      const scale = Math.min(ir.width / regionW, ir.height / regionH);
      return {
        origin: `${cx - wr.left}px ${cy - wr.top}px`,
        transform: `translate(${icx - cx}px, ${icy - cy}px) scale(${scale})`
      };
    }

    /* Everything in the diagram that should fade away so only the related part remains.
       Main circles: all except the chosen circle. Logo / intersection nodes: everything
       (a separate copy of just their region, the "proxy", takes over and shrinks into the icon). */
    function otherParts(id) {
      const kids = [...bigSvg.children].filter(el =>
        el.tagName.toLowerCase() !== 'defs' && !el.classList.contains('region-proxy'));
      const c = CIRCLES[id];
      if (c) {
        const keep = [...bigSvg.querySelectorAll(':scope > circle')][c.idx];
        return kids.filter(el => el !== keep);
      }
      return kids;
    }

    // For logo / intersection nodes: a copy of just their region, drawn on top of the diagram
    function addProxy(id, keyframes, ms) {
      if (!REGIONS[id]) return null;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'region-proxy');
      g.setAttribute('pointer-events', 'none');
      g.innerHTML = regionContent(id, 'px');
      bigSvg.appendChild(g);
      g.animate(keyframes, { duration: ms, easing: 'linear', fill: 'forwards' });
      return g;
    }

    function showInfo(id) {
      if (_busy || _activeId) return;
      _busy = true;
      _activeId = id;
      _page = 0;
      setHighlight(id, true);
      renderSlide(id, _page, false);
      stage.classList.add('has-slide');

      const t = shrinkTransform(regionFor(id));
      diagramWrap.style.pointerEvents = 'none';
      diagramWrap.style.transformOrigin = t.origin;

      // The other two circles (and all labels / logos) fade away early
      const fades = otherParts(id).map(el =>
        el.animate([{ opacity: 1 }, { opacity: 0 }],
          { duration: duration() * 0.4, easing: 'ease-out', fill: 'forwards' })
      );

      const proxy = addProxy(id, [{ opacity: 0 }, { opacity: 1 }], duration() * 0.4);

      // Diagram shrinks into the icon position, then fades out as the icon fades in
      const anim = diagramWrap.animate(
        [
          { transform: 'none', opacity: 1 },
          { opacity: 1, offset: 0.55 },
          { transform: t.transform, opacity: 0 }
        ],
        { duration: duration(), easing: EASE, fill: 'forwards' }
      );
      const icon = slideEl.querySelector('.slide-icon');
      if (icon && duration()) {
        icon.animate([{ opacity: 0 }, { opacity: 1 }],
          { duration: duration() * 0.45, delay: duration() * 0.45, easing: 'ease-out', fill: 'backwards' });
      }
      anim.onfinish = () => {
        diagramWrap.classList.add('diagram-hidden');
        anim.cancel();
        fades.forEach(a => a.cancel());
        if (proxy) proxy.remove();
        diagramWrap.style.pointerEvents = '';
        diagramWrap.style.transformOrigin = '';
        _busy = false;
      };
    }

    function closeSlide() {
      if (_busy || !_activeId) return;
      _busy = true;
      const id = _activeId;
      const t = shrinkTransform(regionFor(id));   // measure while the slide is still there
      setHighlight(id, false);
      _activeId = null;

      diagramWrap.classList.remove('diagram-hidden');
      diagramWrap.style.pointerEvents = 'none';
      diagramWrap.style.transformOrigin = t.origin;
      stage.classList.remove('has-slide');   // slide fades out (its content stays until faded)

      // The other two circles (and labels / logos) fade back in during the second half
      otherParts(id).forEach(el =>
        el.animate([{ opacity: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1 }],
          { duration: duration(), easing: 'linear' })
      );

      const proxy = addProxy(id, [{ opacity: 1 }, { opacity: 1, offset: 0.5 }, { opacity: 0 }], duration());

      // Icon grows back into the full diagram
      const anim = diagramWrap.animate(
        [
          { transform: t.transform, opacity: 0 },
          { opacity: 1, offset: 0.45 },
          { transform: 'none', opacity: 1 }
        ],
        { duration: duration(), easing: EASE }
      );
      anim.onfinish = () => {
        if (proxy) proxy.remove();
        diagramWrap.style.pointerEvents = '';
        diagramWrap.style.transformOrigin = '';
        _busy = false;
      };
    }

    // Jump straight to a page of another topic (used by the (#1) / (#2) links)
    function jumpTo(id, page) {
      if (_busy || !_activeId || !slides[id]) return;
      setHighlight(_activeId, false);
      _activeId = id;
      _page = page || 0;
      setHighlight(id, true);
      renderSlide(id, _page, true);
    }

    function nextPage() {
      if (!_activeId || _busy) return;
      if (_page < slides[_activeId].pages.length - 1) {
        _page++;
        renderSlide(_activeId, _page, true);
      }
    }

    function prevPage() {
      if (!_activeId || _busy || _page === 0) return;
      _page--;
      renderSlide(_activeId, _page, true);
    }

    // Click on empty space (outside diagram and slide) closes the slide
    stage.addEventListener('click', e => {
      if (!e.target.closest('svg, .slide-card')) closeSlide();
    });

    // Keyboard: Esc closes, → next page, ← previous page
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSlide();
      else if (e.key === 'ArrowRight') nextPage();
      else if (e.key === 'ArrowLeft') prevPage();
    });
  </script>
</body>

</html>
